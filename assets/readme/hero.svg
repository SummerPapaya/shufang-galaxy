    <text x="968" y="328" fill="#f5f0e6" fill-opacity="0.55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="15">推门进入 · 试听样片</text>
