      <rect x="390" y="360" width="420" height="24" fill="#030510"/>
      <text x="600" y="377" text-anchor="middle" fill="#f5f0e6" fill-opacity="0.4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="2.4">OBSERVATORY · PARALLEL UNIVERSE</text>
    </g>
    </g>
  </g>

  <!-- Title + bookshelf mark + CTA -->
  <g id="title-block" clip-path="url(#frame-clip)">
    <text x="56" y="56" fill="#aee6ff" fill-opacity="0.88" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="3.6">PODCAST EXPERIENCE · 平行宇宙</text>

    <g transform="translate(56 74)" fill="#f5f0e6">
      <rect x="1" y="16" width="2" height="26" opacity="0.55"/>
      <rect x="41" y="16" width="2" height="26" opacity="0.55"/>
      <rect x="0" y="40" width="44" height="3" rx="1"/>
      <rect x="4" y="12" width="5" height="28" rx="1"/>
      <rect x="10" y="18" width="4" height="22" rx="1" opacity="0.8"/>
      <rect x="15" y="8" width="5" height="32" rx="1" fill="#ffd9a0"/>
      <rect x="21" y="15" width="4" height="25" rx="1"/>
      <rect x="26" y="10" width="5" height="30" rx="1" opacity="0.65"/>
      <rect x="35" y="14" width="5" height="26" rx="1" opacity="0.8" transform="rotate(-8 37.5 40)"/>
    </g>

    <text x="112" y="116" fill="#f5f0e6" font-family="Georgia, 'Songti SC', 'Noto Serif CJK SC', serif" font-size="48" font-weight="700" letter-spacing="6">一个人的书房</text>
    <text x="112" y="150" fill="#ffd9a0" font-family="Georgia, 'Songti SC', 'Noto Serif CJK SC', serif" font-size="22" font-weight="600">「你的，我的，我们的房间」</text>

    <text x="56" y="194" fill="#f5f0e6" fill-opacity="0.74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="20">每一颗星，是一位朗读者的书房。</text>
    <text x="56" y="222" fill="#f5f0e6" fill-opacity="0.74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="20">穿越星河，推开房门，试听有声样片。</text>

    <text x="56" y="258" fill="#f5f0e6" fill-opacity="0.42" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="1.6">星球书房  ·  星空图书馆  ·  Three.js</text>

    <g transform="translate(56 282)">
      <rect width="168" height="42" rx="21" fill="none" stroke="#ffd9a0" stroke-opacity="0.72"/>
      <circle cx="148" cy="21" r="3" fill="#ffd9a0"/>
      <text x="78" y="27" text-anchor="middle" fill="#f5f0e6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="16" font-weight="500" letter-spacing="6">进入星空</text>
    </g>
  </g>

