<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">一个人的书房 · 平行宇宙</title>
  <desc id="desc">播客「一个人的书房」的沉浸式平行宇宙：望远镜锁定书房后，点击右上角「虫洞越迁」进入星空图书馆环形书廊。</desc>

  <defs>
    <linearGradient id="void-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070c20"/>
      <stop offset="55%" stop-color="#030510"/>
      <stop offset="100%" stop-color="#05060f"/>
    </linearGradient>
    <radialGradient id="nebula-violet" cx="18%" cy="30%" r="46%">
      <stop offset="0%" stop-color="#2c2258" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#2c2258" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebula-rose" cx="82%" cy="72%" r="42%">
      <stop offset="0%" stop-color="#4a1f42" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#4a1f42" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="galaxy-band" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#aee6ff" stop-opacity="0.16"/>
      <stop offset="42%" stop-color="#ffd9a0" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#030510" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft white halo (feathered) for every study star -->
    <radialGradient id="halo-white" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="18%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="42%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo-focus" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="12%" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="28%" stop-color="#ffd9a0" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#ffd9a0" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffd9a0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core-white" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="frame-clip">
      <rect width="1200" height="400" rx="26"/>
    </clipPath>
  </defs>

  <!-- Static night field + HUD -->
  <g id="base">
    <rect width="1200" height="400" fill="#030510"/>
    <g clip-path="url(#frame-clip)">
    <rect width="1200" height="400" rx="26" fill="url(#void-fill)"/>
    <rect width="1200" height="400" fill="url(#nebula-violet)"/>
    <rect width="1200" height="400" fill="url(#nebula-rose)"/>
    <ellipse cx="650" cy="208" rx="540" ry="74" fill="url(#galaxy-band)" transform="rotate(-24 650 208)"/>

    <g id="field-stars" fill="#f5f0e6">
      <circle cx="118" cy="58" r="1.2" opacity="0.28"/>
      <circle cx="214" cy="96" r="0.7" opacity="0.4"/>
      <circle cx="286" cy="42" r="0.9" opacity="0.32"/>
      <circle cx="372" cy="128" r="0.6" opacity="0.45"/>
      <circle cx="448" cy="64" r="1.1" opacity="0.35"/>
