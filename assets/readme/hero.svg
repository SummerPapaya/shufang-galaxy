      <circle cx="1108" cy="72" r="0.7" opacity="0.38"/>
      <circle cx="1148" cy="164" r="0.9" opacity="0.26"/>
      <circle cx="1086" cy="248" r="0.6" opacity="0.44"/>
      <circle cx="1162" cy="312" r="0.8" opacity="0.32"/>
      <circle cx="792" cy="324" r="0.7" opacity="0.28"/>
      <circle cx="688" cy="56" r="0.6" opacity="0.36"/>
      <circle cx="628" cy="118" r="0.9" opacity="0.22"/>
