    <g fill="none" stroke="#ffd9a0" stroke-opacity="0.4" stroke-width="1.2" stroke-linecap="square">
      <path d="M36 56 V36 H56"/>
      <path d="M1164 56 V36 H1144"/>
      <path d="M36 344 V364 H56"/>
      <path d="M1164 344 V364 H1144"/>
    </g>

    <g id="hud">
